name: Inner Loop — Security Gates

on:
  push:
    branches:
      - inner-loop-configurations          
  pull_request:
    branches:
      - inner-loop-configurations          

jobs:

  # ── GATE 1: SECRETS DETECTION — TruffleHog ──────────────────
  secrets-detection:
    name: "Secrets — TruffleHog"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        

      - name: TruffleHog — scan git for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          base: ""
          head: ${{ github.ref_name }}  # commented out not to scan full git history, but only the latest commit.
          extra_args: --results=verified,unknown

  # ── GATE 2: SAST — Semgrep ──────────────────
  sast-semgrep:
    name: "SAST — Semgrep"
    runs-on: ubuntu-latest
    needs: secrets-detection
    if: github.actor != 'dependabot[bot]'

    container:
      image: semgrep/semgrep
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Semgrep — scan code for vulnerabilities
        run: semgrep scan --config=auto --error ./backend  
         
  # ── GATE 3: SCA — Snyk ───────────────────────────────────────
  sca:
    name: "SCA — Snyk"
    runs-on: ubuntu-latest
    needs: sast-semgrep
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # - name: Set up Go
      #   uses: actions/setup-go@v1
      #   with:
      #     go-version: '1.19'

      - name: Snyk scan
        uses: snyk/actions/golang@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high --file=backend/go.mod      