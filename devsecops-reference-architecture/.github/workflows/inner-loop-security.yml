name: Inner Loop — Security Gates

on:
  push:
    branches:
      - test          
  pull_request:
    branches:
      - test          

jobs:

  # ── GATE 1: SECRETS DETECTION — TruffleHog ──────────────────
  secrets-detection:
    name: "Secrets — TruffleHog"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        

      - name: TruffleHog — scan git for secrets
        uses: trufflesecurity/trufflehog@main
        with:
          base: ""
          head: ${{ github.ref_name }}  # commented out not to scan full git history, but only the latest commit.
          extra_args: --results=verified,unknown

  # ── GATE 2: SAST — Semgrep ──────────────────
  sast-semgrep:
    name: "SAST — Semgrep"
    runs-on: ubuntu-latest
    needs: secrets-detection
    if: github.actor != 'dependabot[bot]'

    container:
      image: semgrep/semgrep
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Semgrep — scan code for vulnerabilities
        run: semgrep scan --config=auto --error ./backend  
         
     